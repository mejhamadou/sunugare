services:
  postgres:
    image: postgres:16-alpine
    container_name: sunugare-postgres
    environment:
      POSTGRES_DB: sunugare
      POSTGRES_USER: sunugare
      POSTGRES_PASSWORD: sunugare_dev_password
    ports:
      - "5433:5432"  # ⚠️ J'ai changé 5432 en 5433 à gauche !
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunugare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: