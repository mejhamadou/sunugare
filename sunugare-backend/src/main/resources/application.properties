# Application
spring.application.name=sunugare-backend
server.port=${PORT:8082}

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/sunugare
spring.datasource.username=sunugare
spring.datasource.password=sunugare_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Actuator (health check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.sn.jokko.sunugare=DEBUG

