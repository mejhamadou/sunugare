# Application
spring.application.name=sunugare-backend
server.port=8082

# Database
spring.datasource.url=jdbc:postgresql://localhost:5433/sunugare
spring.datasource.username=sunugare
spring.datasource.password=sunugare_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Actuator (health check)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.sn.jokko.sunugare=DEBUG