name: SUNUGARE CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: |
          cd sunugare-backend
          mvn clean package -DskipTests

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22' # ✅ On passe à Node 22 (LTS récent)
          cache: 'npm'
          cache-dependency-path: sunugare-frontend/package-lock.json
      - name: Install dependencies & Build
        run: |
          cd sunugare-frontend
          npm ci
          npm run build